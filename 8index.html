<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Valentine💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-pink: #ffb7c5;
            --bg-color: #fff0f3;
            --text-color: #d63384;
            --accent-red: #ff4d6d;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans Lao', 'Mali', cursive;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
            overflow: hidden; /* ປ້ອງກັນການເລື່ອນໜ້າຈໍໄປມາໃນມືຖື */
            touch-action: manipulation;
        }

        /* Container ຫຼັກ */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #menu-screen, #game-screen {
            width: 100%;
        }

        #game-screen { display: none; }

        .heart-icon {
            font-size: clamp(60px, 15vw, 80px);
            animation: heartbeat 1.2s infinite;
            margin-bottom: 10px;
            display: inline-block;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }

        h1 { 
            font-size: clamp(1.5rem, 7vw, 2rem); 
            margin: 10px 0; 
            text-shadow: 2px 2px white; 
        }

        p { font-size: 1rem; margin-bottom: 20px; }

        /* ສ່ວນວົງລໍ້ Responsive */
        .wheel-container {
            position: relative;
            width: 85vw; /* ປັບຕາມຄວາມກວ້າງໜ້າຈໍມືຖື */
            height: 85vw;
            max-width: 350px;
            max-height: 350px;
            margin: 20px auto;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 30px rgba(214, 51, 132, 0.2);
            border: 6px solid white;
            background-color: white;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 40px;
            background: var(--accent-red);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 20;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
        }

        .btn {
            background: var(--text-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Noto Sans Lao', sans-serif;
            box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
            transition: 0.3s;
            width: 80%;
            max-width: 250px;
        }

        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #ccc; }

        #result {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 3.5em;
            padding: 0 10px;
        }

        .menu-link {
            margin-top: 15px;
            display: block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="menu-screen">
        <div class="heart-icon">💖</div>
        <h1>ວົງລໍ້ສຸ່ມຮັກ</h1>
        <p>ກິດຈະກຳຫວານໆຂອງເຮົາສອງຄົນ</p>
        <button class="btn" onclick="showGame()">ເລີ່ມຫຼິ້ນເລີຍ!</button>
        <br>
        <a href="/3index.html" class="menu-link">📖 ກັບໄປໜ້າເມນູຫຼັກ</a>
    </div>

    <div id="game-screen">
        <h1>ສຸ່ມເລີຍທີ່ຮັກ ❤️</h1>
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel"></canvas>
        </div>
        <button class="btn" id="spinBtn">ໝຸນເລີຍ!</button>
        <div id="result">ພ້ອມແລ້ວບໍ່? ກົດໝຸນເລີຍ! 😊</div>
        <div class="menu-link" style="cursor:pointer" onclick="location.reload()">↺ ກັບຄືນໜ້າທຳອິດ</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultDiv = document.getElementById('result');
    const menuScreen = document.getElementById('menu-screen');
    const gameScreen = document.getElementById('game-screen');

    const gifts = [
        "ກອດກັນ 1ນາທີ🫂", "ຕາມໃຈ1ມື້👑", "ຫອມແກ້ມ1ບາດ💋", 
        "ພາໄປກິນຂອງແຊບ🍦", "ນວດໄຫຼ່ 10 ນາທີ 💆‍♀️", "ເບິ່ງໜັງນຳກັນ 🎬", 
        "ບອກຮັກ3ຄັ້ງ🔊", "4GUN🫢🔞"
    ];

    const colors = ['#ffb7c5', '#f8bbd0', '#f48fb1', '#ffcdd2', '#ff8fa3', '#ff758f', '#ff5c8a', '#ff4d6d'];
    let currentRotation = 0;
    let isSpinning = false;

    function playTickSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function showGame() {
        menuScreen.style.display = 'none';
        gameScreen.style.display = 'block';
        setTimeout(setupCanvas, 10);
    }

    function setupCanvas() {
        const container = document.querySelector('.wheel-container');
        const size = container.clientWidth;
        const dpr = window.devicePixelRatio || 1;
        
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.scale(dpr, dpr);
        drawWheel(size);
    }

    function drawWheel(size) {
        const center = size / 2;
        const radius = center - 5;
        const sliceAngle = (2 * Math.PI) / gifts.length;

        ctx.clearRect(0, 0, size, size);

        gifts.forEach((gift, i) => {
            const angle = i * sliceAngle;
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, angle, angle + sliceAngle);
            ctx.fill();

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(angle + sliceAngle / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "white";
            ctx.font = `bold ${size/16}px 'Noto Sans Lao'`; 
            ctx.fillText(gift.split(' ')[0], radius - 15, 5); // ຕັດຂໍ້ຄວາມໃຫ້ສັ້ນລົງຖ້າຈຳເປັນ
            ctx.restore();
        });

        ctx.beginPath();
        ctx.arc(center, center, 20, 0, 2 * Math.PI);
        ctx.fillStyle = "white";
        ctx.fill();
    }

    spinBtn.addEventListener('click', () => {
        if (isSpinning) return;
        isSpinning = true;
        spinBtn.disabled = true;
        resultDiv.innerText = "ກຳລັງສຸ່ມ...";

        const rounds = 7 + Math.floor(Math.random() * 5);
        const extraDegrees = Math.floor(Math.random() * 360);
        currentRotation += (rounds * 360) + extraDegrees;
        
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        // ສຽງຕິກ
        let interval = setInterval(() => {
            if(isSpinning) playTickSound();
        }, 200);

        setTimeout(() => {
            clearInterval(interval);
            isSpinning = false;
            spinBtn.disabled = false;
            
            const actualRotation = currentRotation % 360;
            const sliceSize = 360 / gifts.length;
            const winningIndex = Math.floor(((360 - (actualRotation % 360) + 270) % 360) / sliceSize);
            
            resultDiv.innerHTML = `🎉 ຍິນດີດ້ວຍ! 🎉<br><span style="font-size: 1.4rem; color: #ff4d6d;">${gifts[winningIndex]}</span>`;

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.7 }
            });
        }, 4000);
    });

    window.addEventListener('resize', () => {
        if (gameScreen.style.display === 'block') setupCanvas();
    });
</script>

</body>
</html>
